request:
  name: Create Product (full form)
  method: POST
  url: "{{baseUrl}}/products"
  headers:
    Content-Type: "application/json"
    Authorization: "Bearer {{token}}"
  body:
    name: "Handmade Scarf"
    productId: "SCARF-001"
    price: 24.99
    size: "One Size"
    description: "Soft hand-knitted scarf"
    materials: "Wool"
    condition: "New"
    quantity: 12
    image: "https://example.com/images/scarf.jpg"
